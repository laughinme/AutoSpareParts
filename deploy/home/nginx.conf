# Public entry point on the home server: static SPA at /, API and uploaded media proxied to the backend.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    # Stripe webhooks, Swagger and the liveness probe live outside /api.
    location ~ ^/(webhooks/|media/|docs$|openapi\.json$|ping$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
